<!DOCTYPE html>
<html lang="de">
<head>
    <!-- WinWidgets Meta-Tags für die richtige Fenstergröße -->
    <meta name="applicationTitle" content="TikTok Live Counter" />
    <meta name="windowSize" content="350 400" />
    <meta name="windowBorderRadius" content="16" />
    <meta name="topMost" content="true" />
    
    <meta charset="UTF-8">
    <title>TikTok Counter</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            background: #fff; 
            font-family: sans-serif; 
        }
    </style>
</head>
<body>

    <!-- Ein unsichtbares Skript-Tag, damit Ihr Code fehlerfrei läuft -->
    <script></script>

    <!-- AB HIER IHR ORIGINALER CODE -->
    <div id="countik-widget"></div>
    <script>
      (function() {
        var countikWidget = document.createElement('script');
        countikWidget.src = 'https://countik.com/widget.js';
        countikWidget.async = true;
        countikWidget.onload = function() {
          if (typeof window.initializeCountikWidget === 'function') {
            window.initializeCountikWidget({
              container: '#countik-widget',
              themeColor: '#444444',
              uniqueId: 'turbotuning1',
              language: 'de'
            });
          }
        };
        var firstScript = document.getElementsByTagName('script')[0];
        firstScript.parentNode.insertBefore(countikWidget, firstScript);
      })();
    </script>
    <a href="https://countik.com/de/user/turbotuning1" target="_blank" class="pow-countik" style="font-size:11px;color:#333;display:block;padding:4px 3px;text-decoration:none;">Unterstützt von Countik™</a>

</body>
</html>
