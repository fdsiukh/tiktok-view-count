<!DOCTYPE html>
<html lang="de">
<head>
    <!-- WinWidgets Einstellungen -->
    <meta name="applicationTitle" content="TikTok Live Counter" />
    <meta name="windowSize" content="350 360" />
    <meta name="windowLocation" content="100 100" />
    <meta name="windowBorderRadius" content="16" />
    <meta name="topMost" content="true" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Counter Widget</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 15px 15px 45px 15px; /* Verhindert das Abschneiden am unteren Rand */
        }
        .widget-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Das Iframe lädt das Widget direkt ohne restriktive Skriptblockaden */
        iframe {
            width: 100%;
            height: 240px;
            border: none;
            overflow: hidden;
        }
        .pow-countik {
            font-size: 11px;
            color: #666;
            text-align: center;
            text-decoration: none;
            display: block;
            padding-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Widget Container mit direktem Iframe-Abruf -->
    <div class="widget-container">
        <iframe src="https://countik.com" scrolling="no"></iframe>
    </div>

    <!-- Der Link ganz unten -->
    <a href="https://countik.com" target="_blank" class="pow-countik">Unterstützt von Countik™</a>

</body>
</html>
